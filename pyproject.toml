[project]
name = "forensics-tool"
version = "0.1.0"
description = "Proof of concept: single-user web GUI for AI-assisted volatility3 RAM analysis"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# volatility3 is installed in the Docker image; optional locally so the app/tests run without it.
volatility = ["volatility3>=2.7"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/templates/*.html", "web/templates/**/*.html", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"app/tools/*" = ["S603"]  # subprocess without shell is intentional; argv is allowlist-built

[tool.pytest.ini_options]
testpaths = ["tests"]
