name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs for the same PR/branch (but never for pushes to main).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  test:
    # Windows too: several developers run the tests natively on Windows.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest] #, windows-latest] # Takes too long to run on windows relative to the minimal extra value
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      # Tests use a fake `vol` executable fixture and recorded outputs in tests/fixtures;
      # no real memory images and no volatility3 install are needed here.
      # `-n auto`: one pytest worker per CPU (pytest-xdist); every test uses its own temp
      # dirs and database, so they are safe to run in parallel.
      - name: Run tests
        run: pytest -q -n auto

  docker:
    # Runs in parallel with lint/test (no `needs:`): total CI time is the slowest job, not the
    # sum. The trade-off: the image is still built when tests fail.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: forensics-tool:dev
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: volatility3 CLI is available in the image
        run: docker run --rm --entrypoint vol forensics-tool:dev -h

      # Smoke test exactly like a developer would run it: no .env file, empty evidence dir.
      - name: Start stack with docker compose
        run: |
          mkdir -p evidence
          rm -f .env
          docker compose up -d --no-build

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo; echo "healthy after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::app did not become healthy within 60s"
          exit 1

      - name: Smoke test endpoints
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/health | tee /dev/stderr | grep -q '"ok"'
          curl -fsS -o /dev/null -w 'GET / -> %{http_code}\n' http://127.0.0.1:8000/
          curl -fsS -o /dev/null -w 'GET /static/htmx.min.js -> %{http_code}\n' \
            http://127.0.0.1:8000/static/htmx.min.js
          # Evidence must be mounted read-only inside the container.
          if docker compose exec -T app sh -c 'touch /evidence/.write-test' 2>/dev/null; then
            echo "::error::/evidence is writable inside the container"; exit 1
          fi
          # Container healthcheck should also report healthy.
          for _ in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            echo "container health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 3
          done
          echo "::error::Docker HEALTHCHECK did not report healthy"; exit 1

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color app

      - name: Tear down
        if: always()
        run: docker compose down -v
