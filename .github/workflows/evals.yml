# Manual AI evaluation run (see evals/README.md). Never runs on pull requests: it calls the AI
# provider (cost, rate limits) and model output varies between runs.
#
# Setup (repo Settings > Secrets and variables > Actions):
#   secrets    FT_AI_BASE_URL, FT_AI_API_KEY  (an OpenAI-compatible endpoint reachable from the
#              runner; a model on your laptop is not)
#   variables  FT_AI_MODEL                    (default model; can be overridden per run)
#              FT_AI_MAX_TOKENS               (optional; default 8000 here - reasoning models such
#                                              as Qwen3 spend part of it on their reasoning)
#              EVAL_RUNNER                    (optional runner label, default ubuntu-latest; use a
#                                              self-hosted runner if the provider is only reachable
#                                              from your network, e.g. a campus-only endpoint)
#
# Saving a baseline: run with "save_baseline" ticked, download the "ai-evaluation-baseline"
# artifact and commit the file to forensics/evals/baselines/ in a pull request (this workflow is read-only).
name: AI evaluation

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model (empty = repository variable FT_AI_MODEL)"
        required: false
        default: ""
      cases:
        description: "Case ids or tags, space separated (empty = all; e.g. 'agent' or 'recommend')"
        required: false
        default: ""
      repeat:
        description: "Attempts per case"
        required: false
        default: "3"
      tool_mode:
        description: "AI agent tool protocol for goal cases"
        type: choice
        options: [auto, native, text]
        default: auto
      judge:
        description: "Also grade answers with an AI judge"
        type: boolean
        default: false
      fail_on_regression:
        description: "Fail the run if a metric dropped vs the committed baseline"
        type: boolean
        default: true
      save_baseline:
        description: "Save this run as the new baseline (attached as an artifact to commit)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ai-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ${{ vars.EVAL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 90  # agent ("goal") cases make several AI calls per attempt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Check the provider
        # Tiny evidence-free requests: plain answer, native tool call, text protocol, reasoning.
        # Fails fast (before the evaluation) if the endpoint is unreachable or misconfigured.
        env:
          FT_AI_BASE_URL: ${{ secrets.FT_AI_BASE_URL }}
          FT_AI_API_KEY: ${{ secrets.FT_AI_API_KEY }}
          FT_AI_MODEL: ${{ inputs.model || vars.FT_AI_MODEL }}
          FT_AI_MAX_TOKENS: ${{ vars.FT_AI_MAX_TOKENS || '8000' }}
          FT_AI_TOOL_MODE: ${{ inputs.tool_mode }}
          FT_DATA_DIR: ${{ runner.temp }}/ft-data
        run: |
          python -m app.ai.probe --out "$RUNNER_TEMP/ai_probe_report.json" > /dev/null
          python - "$RUNNER_TEMP/ai_probe_report.json" <<'PY'
          import json, sys
          verdict = json.load(open(sys.argv[1]))["verdict"]
          print(json.dumps(verdict, indent=2))
          sys.exit(0 if verdict["plain_answer_works"] else 1)
          PY

      - name: Run evaluation
        env:
          FT_AI_BASE_URL: ${{ secrets.FT_AI_BASE_URL }}
          FT_AI_API_KEY: ${{ secrets.FT_AI_API_KEY }}
          FT_AI_MODEL: ${{ inputs.model || vars.FT_AI_MODEL }}
          FT_AI_MAX_TOKENS: ${{ vars.FT_AI_MAX_TOKENS || '8000' }}
          FT_AI_TOOL_MODE: ${{ inputs.tool_mode }}
          # Inputs are passed through the environment, never interpolated into the script.
          EVAL_CASES: ${{ inputs.cases }}
          EVAL_REPEAT: ${{ inputs.repeat }}
          EVAL_JUDGE: ${{ inputs.judge }}
          EVAL_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
          EVAL_SAVE_BASELINE: ${{ inputs.save_baseline }}
        run: |
          args=(--repeat "$EVAL_REPEAT")
          if [ -n "$EVAL_CASES" ]; then
            read -r -a case_list <<< "$EVAL_CASES"
            args+=(--cases "${case_list[@]}")
          fi
          if [ "$EVAL_JUDGE" = "true" ]; then args+=(--judge); fi
          if [ "$EVAL_FAIL_ON_REGRESSION" = "true" ]; then args+=(--fail-on-regression); fi
          if [ "$EVAL_SAVE_BASELINE" = "true" ]; then args+=(--save-baseline); fi
          python -m evals.run "${args[@]}"

      - name: Summary
        if: always()
        run: |
          for report in evals/reports/*.md; do
            [ -f "$report" ] && cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
          true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-report
          path: |
            evals/reports/
            ${{ runner.temp }}/ai_probe_report.json
          if-no-files-found: ignore

      - name: Upload baseline
        if: inputs.save_baseline
        uses: actions/upload-artifact@v4
        with:
          name: ai-evaluation-baseline
          path: forensics/evals/baselines/
          if-no-files-found: warn
