# EXAMPLE case - TODO(forensics): replace with cases built from REAL captured output.
# AI agent ("give the AI a goal"). The harness auto-approves the runs the agent queues and
# completes them from `available_runs` (recorded output per plugin; a plugin not listed there
# fails with "not available in this evaluation case"). Synthetic data: explorer.exe (PID 2000)
# has a missing parent; its command line (only in the cmdline fixture) points to a fake
# explorer.exe in C:\Users\Public with a remote address.
id: agent-goal-example
description: The agent queues cmdline to find how a suspicious process was started.
tags: [example, agent]
evidence:
  rel_path: example.raw
  description: Synthetic example image
  os_info: {os: windows}
runs:
  - plugin: windows.pslist.PsList
    fixture: forensics/fixtures/windows/pstree.jsonl
goal: Find out how explorer.exe (the process whose parent is missing) was started.
agent: {max_steps: 8, max_runs: 2}
available_runs:
  - plugin: windows.cmdline.CmdLine
    fixture: forensics/fixtures/windows/cmdline.jsonl
expect:
  must_mention: ["explorer.exe", "C:\\Users\\Public"]
  must_not_mention: ["mimikatz"]
  queue_plugins: [windows.cmdline.CmdLine]
  forbid_plugins: [windows.pslist.PsList]   # already ran: must not be queued again
  max_queued: 2
  min_citations: 1
judge:
  rubric: >-
    Says explorer.exe (PID 2000) was started from C:\Users\Public\explorer.exe (not the normal
    C:\Windows location) with arguments connecting to 203.0.113.7:4444, cites the cmdline row,
    and flags this as suspicious while noting it needs verification.
