# Developer CLI config only (the app runs migrations itself at startup via app.db.migrate()).
# The database URL is taken from the app settings (FT_DATA_DIR) in app/migrations/env.py.
#
#   alembic revision --autogenerate -m "add foo column"   # then REVIEW the generated file
#   alembic upgrade head
#   alembic downgrade -1
#
# See docs/DEVELOPMENT.md "Database migrations".

[alembic]
script_location = %(here)s/app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
