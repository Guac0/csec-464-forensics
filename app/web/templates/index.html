{% extends "base.html" %}
{% block title %}Evidence{% endblock %}
{% block content %}
<section class="panel">
  <div class="panel-head">
    <h2>Evidence</h2>
    <form method="post" action="/ui/scan" hx-post="/ui/scan" hx-target="#evidence-list" hx-swap="outerHTML">

  <h2>Investigation notes</h2>
  {% include "_notes.html" %}
</section>
{% endblock %}
